# Actions - answered here on the machine, without reaching any room.
#
# An action runs a command and does one of three things with its output:
#   speak = "stdout"  say the output as it stands
#   speak = "retell"  hand the output to Jarvis with `prompt`, he retells it
#   speak = "none"    silence
#
# Your own actions belong in actions.d/*.toml - this file is overwritten by
# `git pull`. Adding one takes no Python: an id, a pattern, a command.
#
# Why an action and not a Claude tool: a fixed route cannot be talked into
# anything. Giving the daemon `Bash` for two Spotify commands was rejected on
# 22.08 - Bash is all or nothing, and a web page Jarvis reads could then talk
# him into running something else.
#
# Patterns are matched against a normalised phrase: lower case, letters and
# spaces only, no punctuation. The wording here is English; a full Russian set
# of the same two actions sits in actions.d/ru.example.toml.

# ---------------------------------------------------------------------------
# What the other Claude sessions on this machine are doing.
#
# The registry lines are facts, not speech, so they go through Jarvis and come
# out in his own voice instead of being read aloud as a table.
# ---------------------------------------------------------------------------
[[action]]
id = "agents"
patterns = [
  '\bagents?\b.{0,30}(status|busy|doing|working|done|finished|ready|where|what)',
  '(status|what|how|where)\w*\b.{0,30}\bagents?\b',
  '(status|summary)\b.{0,20}(of |on )?(the )?(work|sessions?)',
  "(what is|whats|how is|hows)\\b.{0,15}(the chief|the agent)",
  'all my agents|all the agents|my agents',
]
run = "agents_status.py"
speak = "retell"
hint = """Questions about what the agents are doing you answer yourself: the data \
you need arrives with the question, so never ask the owner for it."""
prompt = """The owner asked about the agents: "{q}"

The registry of live Claude sessions on this machine, taken just now:
{facts}

Retell it out loud: who is doing what, and for how long. No paths, no file names, \
no identifiers. If the question was about one agent, talk about that one only."""
fail_say = "The session registry would not read, check the daemon log."
timeout_s = 15

# The script narrows the registry down to one session when the question named
# one. These words name none of them, so they are dropped before the rest are
# handed over as arguments.
[action.words]
limit = 3
min_len = 3
stopwords = [
  "agent", "agents", "status", "statuses", "session", "sessions",
  "work", "working", "what", "how", "where", "the", "give", "there",
  "busy", "doing", "does", "done", "finished", "ready", "all", "my",
  "now", "show", "tell", "happening", "going", "with", "and",
]

# The question has to name an agent, the chief or the sessions. An earlier
# version matched "how is the review going" and hijacked an ordinary question
# about a code review.
[[action.example]]
phrase = "what is the review agent doing"
route = "agents"
[[action.example]]
phrase = "give me a status on the agents work"
route = "agents"
[[action.example]]
phrase = "what is the chief up to"
route = "agents"
[[action.example]]
phrase = "how is the review going"
route = ""
[[action.example]]
phrase = "what is two times two"
route = ""


# ---------------------------------------------------------------------------
# Music. An example of an action with several wordings behind one command:
# `arg` rules pick the arguments, first match wins, `default_args` catches the
# rest. Delete this block and the music commands are gone - nothing else
# refers to it.
# ---------------------------------------------------------------------------
[[action]]
id = "music"
patterns = [
  '\b(?:turn it |a bit |a little )?louder\b', '\bturn (?:it |the volume )?up\b',
  '\b(?:turn it |a bit |a little )?quieter\b', '\bturn (?:it |the volume )?down\b',
  '\bnext (?:track|song|tune)\b', '\bprevious (?:track|song|tune)\b',
  '\bskip (?:this|the) (?:track|song)\b',
  '\bstop the music\b', '\bplay some music\b', '\bput on some music\b',
  '\bpause (?:the )?(?:music|track|song)\b',
  "\\bwhat(?:s| is)\\b.{0,12}\\b(?:playing|this track|this song)\\b",
]
run = "skills/spotify/spotify.sh"
speak = "stdout"
formatter = "formatters:spotify"
default_args = ["state"]
fail_say = "The player is not answering."
timeout_s = 20

[[action.arg]]
patterns = ['\blouder\b', '\bturn (?:it |the volume )?up\b']
args = ["vol", "+10"]
[[action.arg]]
patterns = ['\bquieter\b', '\bturn (?:it |the volume )?down\b']
args = ["vol", "-10"]
[[action.arg]]
patterns = ['\bnext\b', '\bskip\b']
args = ["next"]
[[action.arg]]
patterns = ['\bprevious\b']
args = ["prev"]
[[action.arg]]
patterns = ['\bpause\b', '\bstop the music\b']
args = ["pause"]
[[action.arg]]
patterns = ['\bplay some music\b', '\bput on some music\b']
args = ["play"]

[[action.example]]
phrase = "turn it up a bit"
route = "music"
[[action.example]]
phrase = "whats playing"
route = "music"
[[action.example]]
phrase = "put on some music"
route = "music"
