<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="A Terminal window running jarvisd.sh: the daemon comes up, hears the wake word, records, transcribes what time did the build finish, Claude answers in under two seconds and the reply is spoken.">
  <style>
    text { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #d7dae0; }
    .ts { fill: #6f7680; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #9aa0a6; }
    .green { fill: #5fd68a; }
    .amber { fill: #f0b35a; }
    .blue { fill: #6cb6ff; }
    .muted { fill: #6f7680; }
    .note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #9aa0a6; }
  </style>

  <!-- window -->
  <rect x="20" y="20" width="920" height="360" rx="12" fill="#1a1c21" stroke="#3a3f4a"/>
  <rect x="20" y="20" width="920" height="34" rx="12" fill="#26292f"/>
  <rect x="20" y="42" width="920" height="12" fill="#26292f"/>
  <circle cx="42" cy="37" r="6" fill="#ff5f57"/>
  <circle cx="62" cy="37" r="6" fill="#febc2e"/>
  <circle cx="82" cy="37" r="6" fill="#28c840"/>
  <text x="480" y="41" class="title" text-anchor="middle">jarvis - bash ~/.claude/jarvis/jarvisd.sh</text>

  <!-- log -->
  <text x="40" y="84"><tspan class="muted">$ </tspan>bash ~/.claude/jarvis/jarvisd.sh</text>
  <text x="40" y="108"><tspan class="ts">[09:41:02] </tspan>Jarvis daemon up. Engine: vosk (vosk-model-small-en-us-0.15), model: sonnet.</text>
  <text x="40" y="130"><tspan class="ts">[09:41:03] </tspan>keys active: tap &lt;f18&gt; | done &lt;alt_r&gt; | off &lt;esc&gt;</text>
  <text x="40" y="152"><tspan class="ts">[09:41:04] </tspan>asr worker ready</text>

  <text x="40" y="190"><tspan class="ts">[09:42:17] </tspan><tspan class="green">wake!</tspan></text>
  <text x="40" y="212"><tspan class="ts">[09:42:20] </tspan>record end: silence, peak 1310, noise floor 212, speech yes</text>
  <text x="40" y="234"><tspan class="ts">[09:42:20] </tspan>heard (2.4s audio, 0.6s ASR): <tspan class="blue">'what time did the build finish'</tspan></text>
  <text x="40" y="256"><tspan class="ts">[09:42:22] </tspan>claude (1.9s): <tspan class="amber">'Eleven forty, and it went green on the second try.'</tspan></text>

  <text x="40" y="294"><tspan class="ts">[09:42:31] </tspan><tspan class="green">wake!</tspan></text>
  <text x="40" y="316"><tspan class="ts">[09:42:34] </tspan>heard (2.9s audio, 0.5s ASR): <tspan class="blue">'tell the chief to fix the failing test'</tspan></text>
  <text x="40" y="338"><tspan class="ts">[09:42:34] </tspan>the chief: question sent, watching window 4127</text>

  <!-- side notes -->
  <text x="920" y="190" class="note" text-anchor="end">the wake word, heard offline</text>
  <text x="920" y="234" class="note" text-anchor="end">transcribed on the Mac</text>
  <text x="920" y="256" class="note" text-anchor="end">spoken as it arrives</text>
  <text x="920" y="338" class="note" text-anchor="end">typed into a live agent's window</text>
</svg>
