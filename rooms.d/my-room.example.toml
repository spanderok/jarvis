# Your own rooms. Copy this to rooms.d/anything.toml and edit - files ending
# in .example.toml are documentation and are never loaded.
#
# Everything here is merged over config/rooms.toml by id, so this file can add
# a room, change one field of a shipped room, or switch one off.
#
# The wording below is English because that is the default locale. For a whole
# language swapped at once, see rooms.d/ru.example.toml.

# --- a new room -------------------------------------------------------------
# Start it once with `bash room.sh notes`, then say "ask notes what I wrote
# down about the holiday".
[[room]]
id = "notes"
label = "notes"
session = "notes"                   # claude -n notes
work_dir = "~/notes"
launch = "room.sh notes"
tint = "honeydew"

ask = ["ask notes", "ask my notes", "check my notes"]
tell = ["put this in my notes", "write this down", "note this down"]
bare = ["notes"]

ack_ask = "Asked your notes."
ack_tell = "Written down."
ack_missing = "No window for your notes."

# Say "in my notes" anywhere in a sentence and it comes here with no "ask" in
# front. Leave this out until you are sure the phrase is never said by accident
# - an automatic route that fires on an ordinary question is worse than typing
# two extra words.
# mention_patterns = ['\bin my notes\b']

[[room.example]]
phrase = "ask notes what i wrote about the holiday"
route = ""      # explicit addressing is resolved before routing, so "" is right
[[room.example]]
phrase = "what is two times two"
route = ""


# --- changing a shipped room ------------------------------------------------
# Only the fields you name are touched; the rest stay as config/rooms.toml has
# them. Switching the chat room on takes exactly this much:
#
# [[room]]
# id = "chat"
# enabled = true
# session = "slack"
# mention_patterns = ['\bslack\b']


# --- switching one off ------------------------------------------------------
# [[room]]
# id = "chief"
# enabled = false
